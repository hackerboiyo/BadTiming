```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bad Time Simulator - Direct Sans Fight</title>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%}
#game{width:640px;height:480px;margin:auto}
</style>
<base href="https://jcw87.github.io/c2-sans-fight/">
</head>
<body>
<div id="game"></div>

<script>
const s=document.createElement("script");
s.src="jquery-3.4.1.min.js";
s.onload=()=>{
    const r=document.createElement("script");
    r.src="c2runtime.js";
    r.onload=()=>{
        const c=document.createElement("canvas");
        c.id="c2canvas";
        c.width=640;
        c.height=480;
        document.getElementById("game").appendChild(c);

        cr_createRuntime("c2canvas");

        setTimeout(()=>{
            const send=(key,code)=>{
                document.dispatchEvent(new KeyboardEvent("keydown",{
                    key:key,
                    code:code,
                    keyCode:code==="Enter"?13:90,
                    which:code==="Enter"?13:90,
                    bubbles:true
                }));
                setTimeout(()=>{
                    document.dispatchEvent(new KeyboardEvent("keyup",{
                        key:key,
                        code:code,
                        keyCode:code==="Enter"?13:90,
                        which:code==="Enter"?13:90,
                        bubbles:true
                    }));
                },80);
            };

            send("Enter","Enter");

            setTimeout(()=>{
                send("Enter","Enter");
            },500);

            setTimeout(()=>{
                send("Enter","Enter");
            },1000);
        },2500);
    };
    document.body.appendChild(r);
};
document.body.appendChild(s);
</script>
</body>
</html>
